# Fica no repositório PRIVADO de dados (IFAM-dados).
# Quando uma planilha é enviada para dados/, processa e publica no site.
name: Atualizar site

on:
  push:
    paths: ["dados/**"]
  workflow_dispatch:

concurrency:
  group: atualizar-site
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar as planilhas
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # para saber qual planilha é a mais recente

      - name: Baixar o site
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REPOSITORIO_SITE || 'lucasmetodo02-gif/IFAM' }}
          ref: main
          token: ${{ secrets.TOKEN_SITE }}
          path: repositorio-site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: repositorio-site/pipeline/requirements.txt

      - name: Instalar dependências
        run: pip install -r repositorio-site/pipeline/requirements.txt

      - name: Processar planilhas
        run: python repositorio-site/pipeline/processar.py --entrada dados --saida repositorio-site/site/data

      - name: Publicar os dados no site
        working-directory: repositorio-site
        run: |
          git config user.name "Atualização automática"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Nada mudou nos dados."
            exit 0
          fi
          git commit -m "Atualiza dados ($(TZ=America/Manaus date '+%d/%m/%Y %H:%M'))"
          git push
